services:
  postgres:
    image: postgres:17
    container_name: otap-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-54321}:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username otel --dbname telemetry"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  postgres-data:
    name: otap-postgres-data
