input {
  udp {
    port => 5516
    tags => ["raw"]
    codec => plain {
      charset => "UTF-8"
    }
  }

  syslog {
    port => 5517
    tags => ["json"]
    ecs_compatibility => "disabled"
    grok_pattern => '<%{POSINT:priority}>%{NONNEGINT:version} %{TIMESTAMP_ISO8601:timestamp} %{NOTSPACE:logsource} %{NOTSPACE:program} %{NOTSPACE:pid} %{NOTSPACE:msgid} (?:-|(?<structured_data>(?:\[[^\]]*\])+)) %{GREEDYDATA:message}'
  }

  syslog {
    port => 5518
    tags => ["otlp"]
    ecs_compatibility => "disabled"
    grok_pattern => '<%{POSINT:priority}>%{NONNEGINT:version} %{TIMESTAMP_ISO8601:timestamp} %{NOTSPACE:logsource} %{NOTSPACE:program} %{NOTSPACE:pid} %{NOTSPACE:msgid} (?:-|(?<structured_data>(?:\[[^\]]*\])+)) %{GREEDYDATA:message}'
  }
}

filter {
  if "otlp" in [tags] {
    ruby {
      code => '
        timestamp = event.get("@timestamp")
        time_unix_nano = (timestamp.to_f * 1_000_000_000).to_i
        syslog_severity = event.get("severity").to_i
        severity_number, severity_text = {
          0 => [21, "FATAL"],
          1 => [19, "ERROR3"],
          2 => [18, "ERROR2"],
          3 => [17, "ERROR"],
          4 => [13, "WARN"],
          5 => [10, "INFO2"],
          6 => [9, "INFO"],
          7 => [5, "DEBUG"]
        }.fetch(syslog_severity, [0, "UNSPECIFIED"])
        process_id = Integer(event.get("pid"), exception: false)
        attributes = {
          "syslog.version" => event.get("version").to_i,
          "syslog.facility" => event.get("facility"),
          "syslog.severity" => syslog_severity,
          "syslog.host_name" => event.get("logsource"),
          "syslog.app_name" => event.get("program"),
          "syslog.process_id" => process_id,
          "syslog.process_id_str" => event.get("pid"),
          "syslog.msg_id" => event.get("msgid"),
          "syslog.structured_data" => event.get("structured_data"),
          "syslog.message" => event.get("message"),
          "input.format" => "rfc5424"
        }.filter_map do |key, value|
          next if value.nil?
          any_value = value.is_a?(Integer) ? {"int_value" => value} : {"string_value" => value.to_s}
          {"key" => key, "value" => any_value}
        end
        resource_logs = [{
          "resource" => {},
          "scope_logs" => [{
            "scope" => {},
            "log_records" => [{
              "time_unix_nano" => time_unix_nano,
              "observed_time_unix_nano" => time_unix_nano,
              "severity_number" => severity_number,
              "severity_text" => severity_text,
              "attributes" => attributes
            }]
          }]
        }]
        event.to_hash.keys.each { |key| event.remove(key) }
        event.set("resource_logs", resource_logs)
        event.set("[@metadata][route]", "otlp")
      '
    }
  }
}

output {
  if "raw" in [tags] {
    kafka {
      bootstrap_servers => "kafka:9093"
      topic_id => "syslog-raw-logstash"
      client_id => "logstash-raw-syslog-producer"
      security_protocol => "SASL_SSL"
      sasl_mechanism => "PLAIN"
      sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username='plain' password='plain-secret';"
      ssl_truststore_location => "/etc/kafka/certs/kafka.truststore.jks"
      ssl_truststore_password => "changeit"
      ssl_truststore_type => "JKS"
      codec => plain {
        format => "%{message}"
      }
    }
  } else if "json" in [tags] {
    kafka {
      bootstrap_servers => "kafka:9093"
      topic_id => "syslog-json-logstash"
      client_id => "logstash-json-syslog-producer"
      security_protocol => "SASL_SSL"
      sasl_mechanism => "PLAIN"
      sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username='plain' password='plain-secret';"
      ssl_truststore_location => "/etc/kafka/certs/kafka.truststore.jks"
      ssl_truststore_password => "changeit"
      ssl_truststore_type => "JKS"
      codec => json
    }
  } else if [@metadata][route] == "otlp" {
    kafka {
      bootstrap_servers => "kafka:9093"
      topic_id => "syslog-otlp-logstash"
      client_id => "logstash-otlp-syslog-producer"
      security_protocol => "SASL_SSL"
      sasl_mechanism => "PLAIN"
      sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username='plain' password='plain-secret';"
      ssl_truststore_location => "/etc/kafka/certs/kafka.truststore.jks"
      ssl_truststore_password => "changeit"
      ssl_truststore_type => "JKS"
      value_serializer => "org.apache.kafka.common.serialization.ByteArraySerializer"
      codec => protobuf {
        class_name => "opentelemetry.proto.collector.logs.v1.ExportLogsServiceRequest"
        class_file => "opentelemetry/proto/collector/logs/v1/logs_service_pb.rb"
        protobuf_root_directory => "/etc/logstash/otlp-proto"
        protobuf_version => 3
        pb3_encoder_autoconvert_types => true
      }
    }
  }
}
